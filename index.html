<style>

<body>
<header><button id="burger" aria-label="القائمة">☰</button><h1 id="ttl"></h1></header>
<div id="ov"></div>
<nav id="dr"><div class="brand"><span class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 30c5-2 11-2 19 2v11c-8-4-14-4-19-2z" fill="#fff" fill-opacity=".95"/><path d="M43 30c-5-2-11-2-19 2v11c8-4 14-4 19-2z" fill="#dff3f2"/><path d="M24 32V15" stroke="#f5b942" stroke-width="2.4" stroke-linecap="round"/><path d="M24 25c-7 0-11-3-11-9 7 0 11 3 11 9z" fill="#5ee0b8"/><path d="M24 21c6 0 10-3 10-8-6 0-10 3-10 8z" fill="#8aeccb"/><circle cx="24" cy="11" r="3.2" fill="#f5b942"/></svg></span><div><div class="bt">المختص التربوي</div><div class="bs">محمد مورجان</div></div></div></nav>
<main id="m"></main>
<script>
const S=[];
let CL={};
let db={recs:[],visits:[]};
try{const x=localStorage.getItem('abs2');if(x)db=JSON.parse(x)}catch(e){}
if(db.CL)CL=db.CL;let INF=db.INF||(db.INF={});
const DEF={ac:'الأكاديمية الجهوية للتربية والتكوين',rg:'الرباط - سلا - القنيطرة',dr:'سيدي قاسم',sc:'الثانوية الإعدادية الليمون',yr:(()=>{const d=new Date(),y=d.getFullYear();return d.getMonth()>=7?y+'/'+(y+1):(y-1)+'/'+y})(),ct:'',ph:'',cy:'',dir:'',gd:'',lg:'',lh:16,sh:true};
db.school=Object.assign({},DEF,db.school||{});if(!db.school.dr)db.school.dr=DEF.dr;if(!db.school.yr)db.school.yr=DEF.yr;db.notes=db.notes||[];db.sid=db.sid||{};if(db.school.sc==='إعدادية الليمون')db.school.sc=DEF.sc;
const hs=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return 's'+(h>>>0).toString(36)};
const save=()=>{db.CL=CL;db.INF=INF;try{localStorage.setItem('abs2',JSON.stringify(db))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const $=s=>document.querySelector(s);
const nm=i=>(S.find(s=>s.id==i)||{}).n||'';
const cls=i=>(S.find(s=>s.id==i)||{}).c||'';
const opts=a=>a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
let clsOpts,stuOpts;
const bad=(n,c)=>n===c||/^(اللقب|النسب|الاسم|الإسم|القسم|اللقب والاسم|اسم التلميذ)$/.test(n)||/(إعدادي|ثانوي|ابتدائي|مسار)/.test(n)||/^\d[A-Z]+[-\s]?\d*$/.test(n);
function rebuild(){for(const c in CL)CL[c]=CL[c].filter(n=>!bad(n,c));S.length=0;db.sid=db.sid||{};const used=new Set(Object.values(db.sid)),seen={};for(const c in CL)CL[c].forEach(n=>{let k=c+'|'+n;seen[k]=(seen[k]||0)+1;if(seen[k]>1)k+='#'+seen[k];let i=db.sid[k];if(!i){i=hs(c+n);while(used.has(i))i+='_';used.add(i);db.sid[k]=i}S.push({id:i,n,c})});clsOpts=opts(Object.keys(CL).map(c=>[c,c]));stuOpts=opts(S.map(s=>[s.id,s.n+' — '+s.c]));if(!CL[sel.c])sel.c=Object.keys(CL)[0]||'';if(sel.g!='*'&&!CL[sel.g])sel.g=Object.keys(CL)[0]||'*';if(!G().find(s=>s.id==sel.s))sel.s=G()[0]?G()[0].id:''}
const V=[['home','الرئيسية'],['srch','البحث وبيانات التلاميذ'],['sheet','ورقة الغياب'],['rep','تقرير غيابات الأقسام'],['card','بطاقة غياب التلميذ'],['visits','سجل زيارات الآباء'],['late','سجل التأخرات'],['log','سجل الغيابات'],['inv','استثمار الغياب'],['invc','استثمار الغياب حسب القسم'],['prn','طباعة ورقة الغياب'],['imp','استيراد لائحة التلاميذ'],['bak','النسخ الاحتياطي'],['set','الإعدادات'],['lcl','لائحة التلاميذ حسب القسم'],['lsx','لائحة الذكور والإناث'],['lbk','لائحة التنقيط والمراقبة']];
let cur='home',sel={g:'*',c:'1 أ',d:today(),s:1,marks:{},w:today(),h:1};
const dr=$('#dr');
const MENU=[['home'],['srch'],['g2','اللوائح',['lcl','lsx','lbk']],['g','الغياب',['sheet','prn','rep','card','visits','late','log','inv','invc']],['imp'],['bak'],['set']];
const lab=k=>V.find(v=>v[0]==k)[1];
const IC={g2:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',srch:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',g:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M10 14l4 4M14 14l-4 4"/>',imp:'<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>',bak:'<path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/>'};
const tile=k=>`<span class="tile"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg></span>`;
dr.innerHTML+=MENU.map(m=>m[0][0]=='g'?`<button class="it gh" data-g="1">${tile(m[0])}<span class="lb">${m[1]}</span><b class="bd">${m[2].length}</b><i>▾</i></button><div class="sb">${m[2].map(k=>`<button data-v="${k}"><span class="dot"></span>${lab(k)}</button>`).join('')}</div>`:`<button class="it" data-v="${m[0]}">${tile(m[0])}<span class="lb">${lab(m[0])}</span></button>`).join('');
const _u=[].map(m=>m[0]=='g'?`<button class="gh" data-g="1"><span>${m[1]}</span><span><b class="bd">${m[2].length}</b><i>▾</i></span></button><div class="sb">${m[2].map(k=>`<button data-v="${k}">${lab(k)}</button>`).join('')}</div>`:`<button data-v="${m[0]}">${lab(m[0])}</button>`).join('');
function syncA(){dr.querySelectorAll('.gh').forEach(g=>{g.querySelector('i').textContent=g.nextElementSibling.classList.contains('open')?'▴':'▾'})}
const tog=o=>document.body.classList.toggle('open',o);
$('#burger').onclick=()=>tog(1);$('#ov').onclick=()=>tog(0);
dr.onclick=e=>{const g=e.target.closest('[data-g]');if(g){g.nextElementSibling.classList.toggle('open');syncA();return}const b=e.target.closest('[data-v]');if(b){cur=b.dataset.v;tog(0);go()}};
const count=(f)=>db.recs.filter(f).length;
const rows=t=>{const r=db.recs.filter(x=>x.t==t&&inG(x.s)).sort((a,b)=>b.d<a.d?-1:1);return r.length?r.map(x=>`<div class="card"><div><b>${nm(x.s)}</b><br><small style="color:var(--mu)">${cls(x.s)} · ${x.d}</small></div><span style="display:flex;gap:8px;align-items:center"><span class="tag ${t=='a'?'a':'l'}">${t=='a'?'غياب':'تأخر'}</span><button class="btn s" data-del="${x.id}">حذف</button></span></div>`).join(''):'<div class="empty">لا توجد تسجيلات بعد.</div>'};
const pct=(n,t)=>t?Math.round(n/t*100):0;
function go(){
 rebuild();dr.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==cur));const gp=dr.querySelector('[data-v="'+cur+'"]');if(gp&&gp.closest('.sb'))gp.closest('.sb').classList.add('open');syncA();dr.querySelectorAll('.gh').forEach(g=>g.classList.toggle('act',!!g.nextElementSibling.querySelector('.on')));
 $('#ttl').textContent=V.find(v=>v[0]==cur)[1];
 const m=$('#m');let h='';
 if(cur=='sheet'){
  const L=G();
  const ex={};db.recs.filter(r=>r.d==sel.d).forEach(r=>ex[r.s]=r.t);
  h=`<h2>ورقة الغياب</h2><p class="sub">اختر القسم والتاريخ، ثم علّم حالة كل تلميذ.</p>
  <div class="row"><input type="date" id="d" value="${sel.d}"></div>`+
  L.map(s=>{const v=sel.marks[s.id]||ex[s.id]||'p';return `<div class="card"><b>${s.n}${sel.g=='*'?` <small style="color:var(--mu)">${s.c}</small>`:''}</b><div class="seg" data-s="${s.id}"><button class="p ${v=='p'?'on':''}" data-t="p">حاضر</button><button class="l ${v=='l'?'on':''}" data-t="l">متأخر</button><button class="a ${v=='a'?'on':''}" data-t="a">غائب</button></div></div>`}).join('')+
  `<button class="btn" id="sv">حفظ الورقة</button>`;
 }else if(cur=='log'||cur=='late'){

function parseWb(wb){
 const out={};
 wb.SheetNames.forEach(sn=>{
  const R=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
  let hi=-1,best=0;R.slice(0,20).forEach((r,i)=>{const s=r.filter(x=>String(x).length<25&&/اسم|لقب|نسب|قسم/.test(x)).length;if(s>best){best=s;hi=i}});
  const H=hi>=0?R[hi].map(String):[];const f=re=>H.findIndex(x=>re.test(x));
  let ic=f(/قسم/),il=f(/لقب|نسب/),ifn=f(/اسم/);
  if(il==ifn)il=-1;if(ifn<0&&il<0)ifn=0;
  R.slice(hi+1).forEach(r=>{
   let nm=[il>=0?r[il]:'',ifn>=0?r[ifn]:''].map(x=>String(x).trim()).filter(Boolean).join(' ');
   if(!nm||/^[\d\s.]+$/.test(nm)||/^(اللقب|النسب|الاسم|الإسم|القسم|الاسم الشخصي|الاسم العائلي|اسم التلميذ|اللقب والاسم)$/.test(nm))return;
   const c=(ic>=0&&String(r[ic]).trim())||sn;if(bad(nm,c)||nm===sn)return;(out[c]=out[c]||[]).push(nm)});
 });
 return out}
